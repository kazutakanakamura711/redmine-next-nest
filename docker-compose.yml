services:
  # 初期は PostgreSQL だけを container で動かす。
  # Next.js / NestJS は host 側の pnpm dev で起動する。
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redmine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_DB: ${POSTGRES_DB:-redmine_next_nest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Container を作り直しても、開発用データを残す named volume。
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # API や Prisma migration は、running ではなく healthy を確認してから実行する。
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
