info:
  name: update-project
  type: http
  seq: 4

http:
  method: PATCH
  url: http://localhost:3001/api/projects/{{projectId}}
  body:
    type: json
    data: |-
      {
        "name": "更新後のプロジェクト名",
        "description": "PATCH で更新した説明です。"
      }
  auth:
    type: bearer
    token: '{{accessToken}}'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
