info:
  name: supabase-update-password
  type: http
  seq: 8

http:
  method: PUT
  url: http://127.0.0.1:54321/auth/v1/user
  headers:
    - name: apikey
      value: '{{supabasePublishableKey}}'
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "password": "{{loginPassword}}"
      }
  auth:
    type: bearer
    token: '{{accessToken}}'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # ローカル Supabase のパスワード変更

  ログイン済みの access token で本人を確認し、Supabase Auth のパスワードを変更します。
  NestJS の API ではなく、ローカル Supabase の API を呼び出します。

  1. supabase-login でログインし、有効な token を Local の Secrets の accessToken に保存します。
  2. Local の Secrets の loginPassword を新しいパスワードに変更し、Save します。
  3. このリクエストを Send し、200 OK を確認します。この時点で Supabase 側のパスワードが変わります。
  4. supabase-login を再度 Send して、新しいパスワードで 200 OK になることを確認します。
  5. 新しく取得した access_token を Local の Secrets の accessToken に保存します。

  Local の loginPassword を変えるだけでは、Supabase 側のパスワードは変わりません。
  パスワードや token の実際の値はリクエストファイルに書かず、Secrets に設定します。
