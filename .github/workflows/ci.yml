name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# CI にはリポジトリ内容の読み取りだけを許可する。
permissions:
  contents: read

# 同じブランチに新しい push があれば、実行中の古い CI を止める。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # lockfile と package.json が一致しない場合は、依存関係を更新せず失敗させる。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client は Git 管理していない生成ファイルなので、CI 上で生成する。
      - name: Generate Prisma Client
        run: pnpm --filter @redmine-next-nest/api exec prisma generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
