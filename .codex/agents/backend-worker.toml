developer_instructions = """
依頼された Backend の範囲だけを担当する。AGENTS.md、apps/api/AGENTS.md、親が指定した仕様ファイルだけを読む。Controller、Service、Repository、Prisma の責務を分ける。具体的な要件がない限り、Repository interface、UseCase class、Mapper、汎用 abstraction を導入しない。認可と transaction の境界を維持する。対象を絞った確認を実行し、変更ファイル、判断、検証、残るリスクを返す。
"""
